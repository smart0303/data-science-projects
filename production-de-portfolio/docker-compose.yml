x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://de_user:de_password@postgres:5432/airflow_meta
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-dGVzdC1mZXJuZXQta2V5LWZvci1kZXYtb25seQ==}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: de_portfolio
    POSTGRES_USER: de_user
    POSTGRES_PASSWORD: de_password
    JSONPLACEHOLDER_BASE_URL: https://jsonplaceholder.typicode.com
    PYTHONPATH: /opt/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: de_portfolio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d de_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init-airflow-db:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: de_password
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -h postgres -U de_user -d postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname = 'airflow_meta'" | grep -q 1 \
          || psql -h postgres -U de_user -d postgres -c "CREATE DATABASE airflow_meta;"
    restart: "no"

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: de_portfolio
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      JSONPLACEHOLDER_BASE_URL: https://jsonplaceholder.typicode.com
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init-airflow-db:
        condition: service_completed_successfully
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
