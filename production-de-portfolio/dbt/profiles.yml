production_de_portfolio:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'de_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'de_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'de_portfolio') }}"
      schema: public
      threads: 4
