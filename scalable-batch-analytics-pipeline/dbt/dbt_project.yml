name: batch_analytics
version: 1.0.0
config-version: 2

profile: batch_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  silver_orders_glob: "../lake/silver/orders_parquet/**/*.parquet"
  gold_region_glob: "../lake/gold/sales_by_region_parquet/**/*.parquet"

models:
  batch_analytics:
    staging:
      +materialized: incremental
      +unique_key: order_id
      +incremental_strategy: merge
    marts:
      +materialized: table
