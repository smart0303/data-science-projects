name: pokemon_data_quality
version: 1.0.0
config-version: 2

profile: pokemon_data_quality

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  pokemon_data_quality:
    staging:
      +materialized: view

seeds:
  pokemon_data_quality:
    pokemon_raw:
      +column_types:
        id: integer
        hp: integer
        attack: integer
        defense: integer
        speed: integer
        generation: integer
        legendary: boolean
